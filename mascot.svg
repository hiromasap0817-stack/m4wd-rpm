<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" role="img" aria-label="手を振るレースクイーンのお姉さん">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3f2a"/><stop offset="1" stop-color="#5a2a1c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#1557c9"/>
    </linearGradient>
  </defs>

  <!-- back hair -->
  <path d="M56 86 C46 130 50 178 64 206 C74 214 90 210 98 204 L102 204 C110 210 126 214 136 206 C150 178 154 130 144 86 Z" fill="url(#hair)"/>

  <!-- arms (behind body), waving -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M78 150 L54 140 L42 104" stroke="#ffffff" stroke-width="15"/>
    <path d="M78 150 L54 140 L42 104" stroke="#d9e2ee" stroke-width="15" stroke-dasharray="0 34 60" opacity=".5"/>
    <path d="M122 150 L146 140 L158 104" stroke="url(#blue)" stroke-width="15"/>
  </g>
  <!-- hands -->
  <g fill="#ffe0cc" stroke="#e8b9a0" stroke-width="1">
    <g transform="translate(40 96) rotate(-12)">
      <ellipse cx="0" cy="0" rx="9" ry="10"/>
      <rect x="-9" y="-22" width="4.5" height="14" rx="2.2"/>
      <rect x="-4" y="-25" width="4.5" height="16" rx="2.2"/>
      <rect x="1" y="-24" width="4.5" height="15" rx="2.2"/>
      <rect x="6" y="-20" width="4" height="12" rx="2"/>
      <rect x="8" y="-6" width="9" height="4.5" rx="2.2" transform="rotate(-30 8 -6)"/>
    </g>
    <g transform="translate(160 96) rotate(12) scale(-1 1)">
      <ellipse cx="0" cy="0" rx="9" ry="10"/>
      <rect x="-9" y="-22" width="4.5" height="14" rx="2.2"/>
      <rect x="-4" y="-25" width="4.5" height="16" rx="2.2"/>
      <rect x="1" y="-24" width="4.5" height="15" rx="2.2"/>
      <rect x="6" y="-20" width="4" height="12" rx="2"/>
      <rect x="8" y="-6" width="9" height="4.5" rx="2.2" transform="rotate(-30 8 -6)"/>
    </g>
  </g>

  <!-- legs & boots -->
  <rect x="83" y="236" width="12" height="34" rx="5" fill="#ffe0cc"/>
  <rect x="105" y="236" width="12" height="34" rx="5" fill="#ffe0cc"/>
  <path d="M81 258 h16 v26 a4 4 0 0 1 -4 4 h-14 a5 5 0 0 1 -5 -5 a6 6 0 0 1 7 -6 Z" fill="#ffffff"/>
  <path d="M103 258 h16 v19 a6 6 0 0 1 7 6 a5 5 0 0 1 -5 5 h-14 a4 4 0 0 1 -4 -4 Z" fill="#ffffff"/>
  <rect x="81" y="258" width="16" height="4" fill="url(#blue)"/>
  <rect x="103" y="258" width="16" height="4" fill="url(#blue)"/>
  <rect x="74" y="285" width="23" height="4" rx="2" fill="#1557c9"/>
  <rect x="103" y="285" width="23" height="4" rx="2" fill="#1557c9"/>

  <!-- skirt -->
  <path d="M70 196 L130 196 L148 238 Q100 248 52 238 Z" fill="url(#blue)"/>
  <path d="M52 238 Q100 248 148 238 L150 244 Q100 254 50 244 Z" fill="#ffffff"/>
  <g stroke="#0f46a8" stroke-width="1.5" opacity=".6">
    <line x1="85" y1="198" x2="78" y2="243"/><line x1="100" y1="198" x2="100" y2="246"/><line x1="115" y1="198" x2="122" y2="243"/>
  </g>
  <rect x="70" y="193" width="60" height="7" rx="2" fill="#ffffff"/>
  <rect x="96" y="193" width="8" height="7" fill="#ff4a1c"/>

  <!-- jacket -->
  <path d="M76 142 Q100 134 124 142 L130 196 L70 196 Z" fill="#ffffff"/>
  <path d="M104 137 L124 142 L130 196 L96 196 Z" fill="url(#blue)"/>
  <path d="M100 136 L96 196" stroke="#c9d3df" stroke-width="2"/>
  <path d="M78 168 L122 160 L123 166 L79 174 Z" fill="#ff4a1c"/>
  <!-- number patch -->
  <circle cx="86" cy="186" r="6.5" fill="#ffffff" stroke="#1557c9" stroke-width="1.5"/>
  <text x="86" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-style="italic" font-size="8" fill="#1557c9">4</text>
  <!-- collar & neck -->
  <rect x="94" y="124" width="12" height="14" rx="4" fill="#f5cdb6"/>
  <path d="M88 138 L100 148 L112 138 L106 134 L100 140 L94 134 Z" fill="#e9eef5"/>

  <!-- face -->
  <ellipse cx="100" cy="96" rx="40" ry="38" fill="#ffe7d8"/>
  <!-- side locks -->
  <path d="M62 84 C56 120 60 150 70 176 C74 170 76 150 74 120 C73 104 72 92 70 86 Z" fill="url(#hair)"/>
  <path d="M138 84 C144 120 140 150 130 176 C126 170 124 150 126 120 C127 104 128 92 130 86 Z" fill="url(#hair)"/>
  <!-- bangs -->
  <path d="M60 86 C62 62 80 52 100 52 C120 52 138 62 140 86 C132 80 128 74 124 70 C122 80 118 86 112 88 C112 80 108 74 104 70 C100 80 92 86 84 88 C86 80 86 74 84 70 C78 78 70 84 60 86 Z" fill="url(#hair)"/>

  <!-- racing cap -->
  <path d="M58 72 C60 44 80 32 100 32 C120 32 140 44 142 72 Q100 62 58 72 Z" fill="#ffffff"/>
  <path d="M100 32 C112 32 126 38 134 50 L106 64 Z" fill="url(#blue)"/>
  <path d="M58 72 Q100 62 142 72 L142 76 Q100 66 58 76 Z" fill="#ff4a1c"/>
  <path d="M56 74 Q100 60 150 70 Q156 78 140 80 Q100 70 60 80 Q50 80 56 74 Z" fill="#1557c9"/>
  <circle cx="100" cy="33" r="3" fill="#1557c9"/>

  <!-- eyes -->
  <g>
    <ellipse cx="84" cy="102" rx="7.5" ry="9.5" fill="#3b2016"/>
    <ellipse cx="116" cy="102" rx="7.5" ry="9.5" fill="#3b2016"/>
    <ellipse cx="84" cy="105" rx="5" ry="6" fill="#8a4a2e"/>
    <ellipse cx="116" cy="105" rx="5" ry="6" fill="#8a4a2e"/>
    <circle cx="81.5" cy="98" r="2.6" fill="#ffffff"/>
    <circle cx="113.5" cy="98" r="2.6" fill="#ffffff"/>
    <circle cx="86.5" cy="107" r="1.2" fill="#ffffff"/>
    <circle cx="118.5" cy="107" r="1.2" fill="#ffffff"/>
    <path d="M76 86 Q84 82 92 85" stroke="#5a2a1c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M108 85 Q116 82 124 86" stroke="#5a2a1c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- blush & smile -->
  <ellipse cx="74" cy="115" rx="6" ry="3.2" fill="#ff9a8a" opacity=".55"/>
  <ellipse cx="126" cy="115" rx="6" ry="3.2" fill="#ff9a8a" opacity=".55"/>
  <path d="M93 117 Q100 125 107 117 Q100 120 93 117 Z" fill="#d9534f"/>
  <!-- sparkle -->
  <g fill="#ffcf33">
    <path d="M24 64 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z"/>
    <path d="M176 60 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z"/>
  </g>
</svg>
